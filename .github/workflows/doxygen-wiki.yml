name: Deploy Doxygen Docs to Wiki

on:
  push:
    branches: [ main, user-space-testing ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Doxygen and Graphviz
        run: sudo apt-get update && sudo apt-get install -y doxygen graphviz

      - name: Generate Doxygen docs (HTML + XML)
        run: doxygen Doxyfile

      - name: Download Doxybook2
        run: |
          curl -sL https://github.com/matusnovak/doxybook2/releases/latest/download/doxybook2-linux-amd64-v1.5.0.zip -o doxybook2.zip
          unzip -q doxybook2.zip -d doxybook2

      - name: Convert XML to Markdown
        run: |
          mkdir -p wiki-content
          ./doxybook2/bin/doxybook2 \
            --input docs/xml \
            --output wiki-content \
            --config .doxybook/config.json

      - name: Flatten structure and fix links
        run: python3 .doxybook/flatten_wiki.py wiki-content wiki-flat

      - name: Copy UML and images into wiki content
        run: |
          mkdir -p wiki-flat/images wiki-flat/UML
          cp -r docs/images/. wiki-flat/images/ 2>/dev/null || true
          cp -r docs/UML/. wiki-flat/UML/ 2>/dev/null || true

      - name: Generate UML and Images index pages
        run: |
          cd wiki-flat

          {
            echo "# UML Diagrams"
            echo ""
            for f in UML/*.svg; do
              [ -e "$f" ] || continue
              name=$(basename "$f")
              echo "## $name"
              echo ""
              echo "![$name]($f)"
              echo ""
            done
            echo "## Source files (.puml)"
            echo ""
            for f in UML/*.puml; do
              [ -e "$f" ] || continue
              name=$(basename "$f")
              echo "- [$name]($f)"
            done
          } > UML-Diagrams.md

          {
            echo "# Screenshots"
            echo ""
            for f in images/*; do
              [ -e "$f" ] || continue
              name=$(basename "$f")
              echo "## $name"
              echo ""
              echo "![$name]($f)"
              echo ""
            done
          } > Screenshots.md

          cd ..

      - name: Generate wiki sidebar and home page
        run: |
          cd wiki-flat
          {
            echo "### mexOS Docs"
            echo ""
            echo "- [Home](indexpage)"
            echo "- [Classes](index_classes)"
            echo "- [Files](index_files)"
            echo "- [Namespaces](index_namespaces)"
            echo "- [Modules](index_groups)"
            echo "- [Pages](index_pages)"
            echo "- [Examples](index_examples)"
            echo ""
            echo "### Diagrams"
            echo "- [UML Diagrams](UML-Diagrams)"
            echo "- [Screenshots](Screenshots)"
          } > _Sidebar.md
          cp indexpage.md Home.md
          cd ..

      - name: Checkout wiki repo
        run: |
          git clone https://github-actions:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.wiki.git wiki

      - name: Sync generated docs into wiki
        run: |
          find wiki -maxdepth 1 -mindepth 1 ! -name '.git' -exec rm -rf {} +
          cp -r wiki-flat/. wiki/
          touch wiki/.nojekyll

      - name: Commit and push to wiki
        run: |
          cd wiki
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --cached --quiet || git commit -m "docs: update wiki from Doxygen (${{ github.sha }})"
          git push