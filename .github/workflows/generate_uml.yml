name: Generate UML Diagrams

on:
  push:
    branches: [ main, master, user-space ]
    paths-ignore:
      - 'docs/UML/*.svg'
  pull_request:
    branches: [ main, master, user-space ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generate-diagrams-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate-diagrams:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Graphviz
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 17

      - name: Download PlantUML jar
        run: |
          curl -L -o plantuml.jar https://sourceforge.net/projects/plantuml/files/plantuml.jar/download

      - name: Generate UML diagrams
        run: |
          java -jar plantuml.jar -tsvg docs/UML/*.puml || true

      - name: Commit and push generated diagrams
        if: github.event_name != 'pull_request'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update UML diagrams [skip ci]"
          file_pattern: "docs/UML/*.svg"